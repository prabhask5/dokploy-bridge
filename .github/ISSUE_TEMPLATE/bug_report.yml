name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: dokploy-bridge logs
      description: "`docker logs dokploy-bridge --since 30m` (remove anything private). LOG_LEVEL=debug adds detail."
      render: text
  - type: input
    id: bridge-version
    attributes:
      label: dokploy-bridge version
      description: The first log line says "dokploy-bridge X.Y.Z starting".
    validations:
      required: true
  - type: input
    id: dokploy-version
    attributes:
      label: Dokploy version
    validations:
      required: true
  - type: dropdown
    id: github
    attributes:
      label: GitHub
      options: [github.com, GitHub Enterprise Server]
