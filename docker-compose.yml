# Run dokploy-bridge next to Dokploy. Copy .env.example to .env and fill it in first.
services:
  dokploy-bridge:
    image: ghcr.io/prabhask5/dokploy-bridge:latest
    container_name: dokploy-bridge
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data                                # state.json and defaults.json
      - /etc/dokploy/logs:/etc/dokploy/logs:ro      # build logs, for the check report (optional)
    networks: [dokploy-network]

networks:
  dokploy-network:
    external: true
